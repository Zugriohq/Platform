# Zugrio private validation alpha — API host of the two-VM zero-cost topology
# (OCI Always Free VM.Standard.E2.1.Micro, 1 GB RAM). NO LIVE CAPITAL.
# See docs/runbooks/PRIVATE_ALPHA_OCI_SPLIT_MICRO.md. The database host runs ../db.
#
#   cp .env.example .env && chmod 600 .env && edit .env    # never commit .env
#   docker compose up -d --build                            # migrate + api (no tunnel)
#   docker compose -f docker-compose.yml -f ../../docker-compose.tunnel.yml up -d
#                                                           # + Cloudflare Tunnel
#
# Same image, migrate one-shot, hardening and loopback-only publishing as the single-VM
# stack (../../docker-compose.yml); only DATABASE_URL points at the DB VM's private IP.

name: zugrio-alpha

x-api-image: &api-image
  image: ${ZUGRIO_API_IMAGE:-zugrio-api:local}
  build:
    context: ../../../..
    dockerfile: apps/api/Dockerfile

x-hardening: &hardening
  read_only: true
  tmpfs: ["/tmp"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

x-database-url: &database-url
  DATABASE_URL: postgresql://${POSTGRES_USER:-zugrio}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@${ZUGRIO_DB_HOST:?ZUGRIO_DB_HOST must be the DB VM private IP}:5432/${POSTGRES_DB:-zugrio}

services:
  # Mandatory fail-closed boundary. A public/wildcard DB address or placeholder password
  # must fail before migrations or the API can start.
  preflight:
    <<: [*api-image, *hardening]
    restart: "no"
    environment:
      ZUGRIO_DB_HOST: ${ZUGRIO_DB_HOST:?ZUGRIO_DB_HOST must be the DB VM private IP}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - ../validate-private-ip.sh:/preflight/validate-private-ip.sh:ro
    command:
      - /bin/sh
      - -ec
      - |
        case "$POSTGRES_PASSWORD" in replace-*|"") echo "refusing placeholder PostgreSQL password" >&2; exit 64;; esac
        exec /preflight/validate-private-ip.sh "$ZUGRIO_DB_HOST" ip
    networks: [edge]

  # One-shot: applies committed Prisma migrations (including the ADR-0002 ledger guards)
  # before the API starts. Re-running it is a no-op when the schema is current.
  migrate:
    <<: [*api-image, *hardening]
    command: ["node_modules/.bin/prisma", "migrate", "deploy"]
    restart: "no"
    environment:
      <<: *database-url
    depends_on:
      preflight:
        condition: service_completed_successfully
    networks: [edge]

  api:
    <<: [*api-image, *hardening]
    restart: unless-stopped
    environment:
      <<: *database-url
      PORT: "3000"
      ZUGRIO_CORS_ORIGINS: ${ZUGRIO_CORS_ORIGINS:-*}
      ZUGRIO_LOG_FORMAT: json
    ports:
      - "127.0.0.1:${ZUGRIO_API_LOCAL_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [edge]
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

networks:
  # Outbound only: the DB VM over the VCN, and cloudflared to Cloudflare.
  edge: {}