name: Private alpha build

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "apps/api/**"
      - "packages/domain/**"
      - "packages/decision-core/**"
      - "packages/alpha-api-contract/**"
      - "infra/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "scripts/release/**"
      - ".github/workflows/private-alpha.yml"
  push:
    branches:
      - "release/private-validation-alpha-2026-09-28"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      # Throwaway CI database for the ADR-0002 ledger integration tests.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci-throwaway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ZUGRIO_TEST_DATABASE_URL: postgresql://postgres:ci-throwaway@localhost:5432/postgres
      # Fail (not skip) if the PostgreSQL integration suite cannot run.
      ZUGRIO_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - name: Prisma schema validation
        run: pnpm --filter @zugrio/api prisma:validate
      - name: Tests (decision-core, contract, API incl. PostgreSQL, desktop client + app, release scripts)
        run: pnpm test
      - name: Strict typecheck
        run: pnpm typecheck
      - name: Build (packages, API, desktop)
        run: pnpm build

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gitleaks (working tree)
        run: docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.30.1 dir . --no-banner --redact --exit-code 1

  api-image-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - uses: docker/setup-buildx-action@v3
      - name: Build linux/arm64 API image (OCI Ampere A1 target)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/arm64
          push: false
          load: true
          tags: zugrio-api:arm64-ci
          cache-from: type=gha,scope=api-arm64
          cache-to: type=gha,mode=max,scope=api-arm64
      - name: Run the arm64 image under emulation
        run: |
          set -euo pipefail
          test "$(docker image inspect zugrio-api:arm64-ci --format '{{.Architecture}}')" = arm64
          docker run -d --name api-arm64 --platform linux/arm64 -p 127.0.0.1:3000:3000 \
            -e ZUGRIO_ALPHA_PERSISTENCE=memory zugrio-api:arm64-ci
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:3000/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:3000/health | jq -e '.meta.liveCapitalAuthority == false and .data.status == "ok"'
          docker exec api-arm64 node -e 'if (process.arch !== "arm64") process.exit(1)'
          docker exec api-arm64 node_modules/.bin/prisma --version
      - if: failure()
        run: docker logs api-arm64 || true

  compose-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/oci
    steps:
      - uses: actions/checkout@v4
      - name: Bring up postgres + migrate + api
        run: |
          set -euo pipefail
          printf 'POSTGRES_PASSWORD=%s\nZUGRIO_API_LOCAL_PORT=3000\n' "$(openssl rand -hex 32)" > .env
          docker compose up -d --build
          ../../.github/scripts/wait-for-healthy.sh zugrio-alpha-api-1 300
          docker compose ps -a
          test "$(docker inspect -f '{{.State.ExitCode}}' zugrio-alpha-migrate-1)" = 0
      - name: Tunnel overlay is valid and demands a token
        run: |
          set -euo pipefail
          CLOUDFLARE_TUNNEL_TOKEN=placeholder docker compose -f docker-compose.yml -f docker-compose.tunnel.yml config --quiet
          if docker compose -f docker-compose.yml -f docker-compose.tunnel.yml config --quiet 2>/dev/null; then
            echo "tunnel overlay must refuse to start without CLOUDFLARE_TUNNEL_TOKEN"; exit 1
          fi
      - name: Smoke test
        run: ./smoke-test.sh http://127.0.0.1:3000
      - name: Persistence survives an API restart
        run: |
          set -euo pipefail
          docker compose restart api
          ../../.github/scripts/wait-for-healthy.sh zugrio-alpha-api-1 120
          ./smoke-test.sh http://127.0.0.1:3000 | tee smoke.log
          grep -q 'created=false' smoke.log
      - name: API is not published on a public interface
        run: |
          set -euo pipefail
          docker compose port api 3000 | grep -q '^127.0.0.1:'
      - if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down -v

  # Two-VM zero-cost topology (OCI Always Free E2.1.Micro x2): infra/oci/split/{db,api}.
  # One runner plays both hosts: PostgreSQL is published on the runner's primary IP (the
  # DB VM's private IP in production) and the API stack reaches it over that address.
  compose-split-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/oci/split
    steps:
      - uses: actions/checkout@v4
      - name: Write both host .env files
        run: |
          set -euo pipefail
          host_ip="$(hostname -I | awk '{print $1}')"
          pw="$(openssl rand -hex 32)"
          printf 'POSTGRES_PASSWORD=%s\nZUGRIO_DB_BIND_ADDR=%s\nZUGRIO_BACKUP_DIR=%s\n' "$pw" "$host_ip" "$RUNNER_TEMP/backups" > db/.env
          printf 'POSTGRES_PASSWORD=%s\nZUGRIO_DB_HOST=%s\nZUGRIO_API_LOCAL_PORT=3000\n' "$pw" "$host_ip" > api/.env
          echo "HOST_IP=$host_ip" >> "$GITHUB_ENV"
      - name: DB host — postgres published on the private address only
        working-directory: infra/oci/split/db
        run: |
          set -euo pipefail
          docker compose up -d
          ../../../../.github/scripts/wait-for-healthy.sh zugrio-alpha-db-postgres-1 120
          test "$(docker compose port postgres 5432)" = "$HOST_IP:5432"
          docker compose exec -T postgres sh -ec 'grep -Eq "^host[[:space:]]+all[[:space:]]+all[[:space:]]+all[[:space:]]+scram-sha-256" "$PGDATA/pg_hba.conf"'
      - name: API host — migrate + api against the remote database
        working-directory: infra/oci/split/api
        run: |
          set -euo pipefail
          docker compose up -d --build
          ../../../../.github/scripts/wait-for-healthy.sh zugrio-alpha-api-1 300
          docker compose ps -a
          test "$(docker inspect -f '{{.State.ExitCode}}' zugrio-alpha-migrate-1)" = 0
          docker compose port api 3000 | grep -q '^127.0.0.1:'
      - name: Tunnel overlay composes with the API host and demands a token
        working-directory: infra/oci/split/api
        run: |
          set -euo pipefail
          CLOUDFLARE_TUNNEL_TOKEN=placeholder docker compose -f docker-compose.yml -f ../../docker-compose.tunnel.yml config --quiet
          if docker compose -f docker-compose.yml -f ../../docker-compose.tunnel.yml config --quiet 2>/dev/null; then
            echo "tunnel overlay must refuse to start without CLOUDFLARE_TUNNEL_TOKEN"; exit 1
          fi
      - name: Split env guards reject public/wildcard addresses
        run: |
          set -euo pipefail
          ./validate-private-ip.sh "$HOST_IP" ip
          for bad in 8.8.8.8 0.0.0.0 127.0.0.1 169.254.1.1; do
            if ./validate-private-ip.sh "$bad" ip; then echo "must refuse $bad"; exit 1; fi
          done
          for bad in 0.0.0.0/0 10.0.0.0/24 8.8.8.8/32; do
            if ./validate-private-ip.sh "$bad" cidr32; then echo "must refuse $bad"; exit 1; fi
          done
          pw="$(grep '^POSTGRES_PASSWORD=' api/.env | cut -d= -f2-)"
          for c in zugrio-alpha-preflight-1 zugrio-alpha-db-preflight-1; do
            cmd="$(docker inspect -f '{{json .Config.Cmd}}' "$c")"
            if grep -Fq "$pw" <<<"$cmd"; then echo "secret leaked into $c command"; exit 1; fi
          done
          cp api/.env api/.env.good
          sed -i 's/^ZUGRIO_DB_HOST=.*/ZUGRIO_DB_HOST=8.8.8.8/' api/.env
          # `up` alone exits 0 whatever the one-shot returns; --exit-code-from propagates it.
          rc=0; (cd api && docker compose up --exit-code-from preflight preflight) || rc=$?
          test "$rc" = 64 || { echo "API preflight must reject public DB host with 64 (got $rc)"; exit 1; }
          mv api/.env.good api/.env
          cp db/.env db/.env.good
          sed -i 's/^ZUGRIO_DB_BIND_ADDR=.*/ZUGRIO_DB_BIND_ADDR=0.0.0.0/' db/.env
          rc=0; (cd db && docker compose up --exit-code-from preflight preflight) || rc=$?
          test "$rc" = 64 || { echo "DB preflight must reject wildcard bind with 64 (got $rc)"; exit 1; }
          mv db/.env.good db/.env
      - name: DB firewall admits only the API source /32 and drops other sources
        run: |
          set -euo pipefail
          api_ip="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' zugrio-alpha-api-1)"
          ./validate-private-ip.sh "$api_ip" ip
          sudo ./db/restrict-postgres-source.sh "$api_ip/32"
          sudo ./db/restrict-postgres-source.sh "$api_ip/32"
          sudo iptables -t raw -S PREROUTING
          sudo iptables -t raw -S ZUGRIO_PG_GUARD
          test "$(sudo iptables -t raw -S PREROUTING | grep -c 'zugrio-postgres-guard')" = 1
          test "$(sudo iptables -t raw -S ZUGRIO_PG_GUARD | grep -c -- "-s $api_ip/32 -j RETURN")" = 1
          test "$(sudo iptables -t raw -S ZUGRIO_PG_GUARD | grep -c -- '-j DROP')" = 1
          if sudo ./db/restrict-postgres-source.sh 0.0.0.0/0; then echo "must refuse 0.0.0.0/0"; exit 1; fi
          if sudo ./db/restrict-postgres-source.sh 8.8.8.8/32; then echo "must refuse public source"; exit 1; fi
          if sudo ./db/restrict-postgres-source.sh 10.99.0.0/24; then echo "must require /32"; exit 1; fi
          # Reconfiguration replaces the old allowed source rather than accumulating
          # contradictory stale negated-source rules.
          sudo ./db/restrict-postgres-source.sh 10.42.99.99/32
          sudo iptables -t raw -S ZUGRIO_PG_GUARD | grep -q -- '-s 10.42.99.99/32 -j RETURN'
          if sudo iptables -t raw -S ZUGRIO_PG_GUARD | grep -q -- "-s $api_ip/32 -j RETURN"; then
            echo "old API source remained after replacement"; exit 1
          fi
          sudo ./db/restrict-postgres-source.sh "$api_ip/32"
          docker network create --subnet 10.99.0.0/24 not-the-api
          if docker run --rm --network not-the-api postgres:16-alpine pg_isready -h "$HOST_IP" -t 5; then
            echo "postgres reachable from a non-API source"; exit 1
          fi
          docker run --rm --network "container:zugrio-alpha-api-1" postgres:16-alpine pg_isready -h "$HOST_IP" -t 5
      - name: Smoke test
        working-directory: infra/oci/split/api
        run: ./smoke-test.sh http://127.0.0.1:3000
      - name: Persistence survives API and database restarts
        run: |
          set -euo pipefail
          (cd api && docker compose restart api)
          ../../../.github/scripts/wait-for-healthy.sh zugrio-alpha-api-1 120
          (cd api && ./smoke-test.sh http://127.0.0.1:3000) | tee smoke-api-restart.log
          grep -q 'created=false' smoke-api-restart.log
          (cd db && docker compose restart postgres)
          ../../../.github/scripts/wait-for-healthy.sh zugrio-alpha-db-postgres-1 120
          (cd api && ./smoke-test.sh http://127.0.0.1:3000) | tee smoke-db-restart.log
          grep -q 'created=false' smoke-db-restart.log
      - name: Backup on the DB host produces a restorable dump
        working-directory: infra/oci/split/db
        run: |
          set -euo pipefail
          ./backup-postgres.sh
          dump="$(ls -1t "$RUNNER_TEMP"/backups/zugrio-*.dump | head -1)"
          docker compose exec -T postgres pg_restore --list < "$dump" | grep -q decision_event
      - if: failure()
        run: |
          (cd api && docker compose logs) || true
          (cd db && docker compose logs) || true
      - if: always()
        run: |
          (cd api && docker compose down -v) || true
          (cd db && docker compose down -v) || true

  windows-portable:
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:packages
      - run: pnpm --filter @zugrio/desktop dist:win
      - name: SHA-256 of the local-replay executable
        shell: bash
        working-directory: apps/desktop/release
        run: |
          set -euo pipefail
          shopt -s nullglob
          exes=(*.exe)
          if [ "${#exes[@]}" -ne 1 ]; then echo "expected exactly one executable, found ${#exes[@]}"; exit 1; fi
          sha256sum "${exes[0]}" > "${exes[0]}.sha256"
          {
            echo '### Local-replay artifact'
            echo '```'
            cat "${exes[0]}.sha256"
            echo '```'
            echo 'Signing: **UNSIGNED**'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: zugrio-private-alpha-windows
          if-no-files-found: error
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.exe.sha256