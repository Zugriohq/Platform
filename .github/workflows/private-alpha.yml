name: Private alpha build

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "packages/decision-core/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/private-alpha.yml"
  push:
    branches:
      - "release/private-validation-alpha-2026-09-28"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

  windows-portable:
    runs-on: windows-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter @zugrio/decision-core build
      - run: pnpm --filter @zugrio/desktop dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: zugrio-private-alpha-windows
          path: apps/desktop/release/*.exe
