name: Research — synthetic null harness

on:
  pull_request:
    paths:
      - "research/synthetic-null/**"
      - ".github/workflows/research-synthetic-null.yml"
  push:
    branches: [main]
    paths:
      - "research/synthetic-null/**"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/synthetic-null
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests

  ctrader-recorder:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research/synthetic-null/tools/ctrader/ZugrioTickRecorder/ZugrioTickRecorder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: No trading calls in the recorder
        run: "! grep -nE 'ExecuteMarketOrder|PlaceLimitOrder|PlaceStopOrder|PlaceStopLimitOrder|ModifyPosition|ClosePosition|CancelPendingOrder|ModifyPendingOrder' ZugrioTickRecorder.cs"
      - name: Build against the official cTrader.Automate SDK
        run: dotnet build -c Release
